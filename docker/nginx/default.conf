server {
	listen 80;
	root /var/www/html/public;

	location / {
		try_files $uri /index.php$is_args$args;
	}

	location = /index.php {
		fastcgi_pass php:9000; # send it to the container named php, port 9000”. Docker turns the name php into the container’s address
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; # nginx tells PHP-FPM which file to run, as text
	}
	location ~\.php$ {
		return 404;
	}
}